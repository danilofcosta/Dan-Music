version: 1.0.0+1

environment:
  sdk: ^3.10.0
dependencies:
  flutter:
    sdk: flutter
  #manager audio
  audio_service: ^0.18.18
  just_audio: ^0.10.5
  audio_session: ^0.2.2


  #maneger get audio
  flutter_new_pipe_extractor:
    git:
     url: https://github.com/danilofcosta/flutter_new_pipe_extractor.git
  youtube_explode_dart: ^3.0.5
  
 # api youtube
  ytmusicapi_dart: ^2.3.0
  
  #ui
  palette_generator: ^0.3.3+7
  cached_network_image: ^3.4.1
  
  #manage state  
  get: ^4.7.3
  path_provider: ^2.1.5
  rxdart: ^0.28.0
